<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Temperatur Dashboard</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .value {
      font-size: 2em;
      text-align: center;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      font-size: 1em;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      font-size: 1em;
      cursor: pointer;
    }

    .on {
      background: #4CAF50;
      color: white;
    }

    .off {
      background: #f44336;
      color: white;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Temperatur</h1>

  <div class="value">
    <span id="tempIs">--.-</span> °C
  </div>

  <button id="switchBtn" class="off">Heizung AUS</button>

  <label for="tempShould">Soll‑Temperatur (°C)</label>
  <input type="number" id="tempShould" step="0.1">
</div>

<script>
  /* ===================== FIREBASE CONFIG ===================== */
  const firebaseConfig = {
    apiKey: "AIzaSyCKEi-jIRiYfUe_aleQYWpXp7a_-7iDBm4",
    databaseURL: "https://gks-heat-control-default-rtdb.europe-west1.firebasedatabase.app/"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ===================== REFERENCES ===================== */
  const tempIsRef = db.ref("TEMP/temp_is");
  const switchRef = db.ref("TEMP/switch");
  const tempShouldRef = db.ref("TEMP/temp_should");

  const tempIsEl = document.getElementById("tempIs");
  const switchBtn = document.getElementById("switchBtn");
  const tempShouldInput = document.getElementById("tempShould");

  /* ===================== LIVE TEMPERATURE ===================== */
  tempIsRef.on("value", snapshot => {
    const value = snapshot.val();
    if (value !== null) {
      tempIsEl.textContent = value.toFixed(1);
    }
  });

  /* ===================== SWITCH ===================== */
  switchRef.on("value", snapshot => {
    const state = snapshot.val();
    if (state) {
      switchBtn.textContent = "Heizung EIN";
      switchBtn.className = "on";
    } else {
      switchBtn.textContent = "Heizung AUS";
      switchBtn.className = "off";
    }
  });

  switchBtn.addEventListener("click", () => {
    switchRef.get().then(snapshot => {
      switchRef.set(!snapshot.val());
    });
  });

  /* ===================== TARGET TEMPERATURE ===================== */
  tempShouldRef.on("value", snapshot => {
    const value = snapshot.val();
    if (value !== null) {
      tempShouldInput.value = value;
    }
  });

  tempShouldInput.addEventListener("change", () => {
    tempShouldRef.set(parseFloat(tempShouldInput.value));
  });
</script>

</body>
</html>
